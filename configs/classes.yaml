# Mapping from raw SemanticKITTI label IDs to learning classes (0..19)
raw_to_learning_map:
  0: 0      # "unlabeled"
  1: 0      # "outlier"
  10: 1     # "car"
  11: 2     # "bicycle"
  13: 5     # "bus" mapped to "other-vehicle"
  15: 3     # "motorcycle"
  16: 5     # "on-rails" mapped to "other-vehicle"
  18: 4     # "truck"
  20: 5     # "other-vehicle"
  30: 6     # "person"
  31: 7     # "bicyclist"
  32: 8     # "motorcyclist"
  40: 9     # "road"
  44: 10    # "parking"
  48: 11    # "sidewalk"
  49: 12    # "other-ground"
  50: 13    # "building"
  51: 14    # "fence"
  52: 13    # "other-structure" mapped to "building"
  60: 9     # "lane-marking" mapped to "road"
  70: 15    # "vegetation"
  71: 16    # "trunk"
  72: 17    # "terrain"
  80: 18    # "pole"
  81: 19    # "traffic-sign"
  99: 0     # "other-object"
  252: 1    # "moving-car" -> car
  253: 7    # "moving-bicyclist" -> bicyclist
  254: 6    # "moving-pedestrian" -> person
  255: 8    # "moving-motorcycle" -> motorcyclist
  256: 5    # "moving-on-rails" -> other-vehicle
  257: 5    # "moving-bus" -> other-vehicle
  258: 4    # "moving-truck" -> truck
  259: 5    # "moving-other-vehicle" -> other-vehicle
