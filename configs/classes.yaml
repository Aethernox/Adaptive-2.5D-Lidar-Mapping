# Semantic Classes Configuration
# Mappings between Raw SemanticKITTI IDs, Model Learning IDs, and High-Level Project Categories

# High-Level Project Semantic Categories
project_categories:
  0: "UNKNOWN"
  1: "DRIVABLE"
  2: "NON_DRIVABLE"
  3: "STATIC_STRUCTURE"
  4: "THIN_OBSTACLE"
  5: "DYNAMIC_VEHICLE"
  6: "DYNAMIC_PEDESTRIAN"

# Project category colors (RGB in [0, 255])
project_category_colors:
  UNKNOWN: [128, 128, 128]          # Gray
  DRIVABLE: [80, 240, 80]           # Bright Green
  NON_DRIVABLE: [160, 110, 60]      # Brown / Dirt
  STATIC_STRUCTURE: [70, 130, 180]  # Steel Blue
  THIN_OBSTACLE: [255, 140, 0]      # Dark Orange
  DYNAMIC_VEHICLE: [255, 40, 40]    # Vibrant Red
  DYNAMIC_PEDESTRIAN: [255, 215, 0] # Gold / Bright Yellow

# Model Learning Classes (20 classes: 0 = ignore/unlabeled, 1..19 = classes)
learning_classes:
  0:
    name: "unlabeled"
    project_category: "UNKNOWN"
    dynamic: false
    weight: 0.0
    color: [0, 0, 0]
